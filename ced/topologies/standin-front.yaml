# 无 Docker 时的真实链路：客户端 → 替身前置 → 探针（扮演后端）
#
# 起链路（一条命令，两个进程）：
#   python -m ced serve --front --front-mode ref-te-first \
#          --policy ref-cl-first --data-port 8800 --api-port 8801 --front-port 18080
#
# 跑扫描（cross 模式会把替身前置与每个本地参照实现都配一遍对）：
#   python -m ced scan --topology ced/topologies/standin-front.yaml \
#          --mode cross --limit 60 --out results/standin.md --poc-dir results/pocs
#
# 与 docker/ 里的真实 nginx 链路同构，只是拿掉了容器：
# 被观测的始终是「前置按自己的策略定帧后，转发出去的那段字节」。
domain: http1-framing

impls:
  # 被测的"前置"：按 ref-te-first 策略定帧，只转发它认为属于本条请求的字节。
  # 想换成"会改写 CL 的前置"，把 front-mode 改成 rewrite_cl 即可。
  - id: standin-front
    name: standin-front
    version: "front-mode=ref-te-first"
    role: front
    runner: chain
    endpoint: 127.0.0.1:18080
    probe_api: 127.0.0.1:8801
    notes: 替身前置（无 Docker 时的演示用）；不是被测对象，只提供链路形状

  # 基准侧：本地参照实现
  - id: ref-cl-first
    role: back
    runner: local
    policy: ref-cl-first

  - id: ref-lenient-cl
    role: back
    runner: local
    policy: ref-lenient-cl

# 报告里用来解释"若这两者串联会怎样"
chain: [standin-front, ref-cl-first]
