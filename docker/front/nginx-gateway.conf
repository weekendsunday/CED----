# =============================================================================
# CED 第二档演示的入口：nginx(gateway) → gunicorn(backend) → 探针。
#
# 与 front/nginx.conf 的区别只有一处：upstream 是 gunicorn，不是探针。
# 两者都是**被观测的前置**，定位相同：如实按自己的定帧策略处理，不做防护。
#
# 链路：客户端 → 本 nginx(容器内 8081) → backend:8090(gunicorn) → probe:8800
#       观测点在 gunicorn 之后（WSGI 应用重建后转给探针，见 docker/backend/app.py）。
#
# 这里显式加了 X-Forwarded-*：它们**是否被 gunicorn 采信**取决于 gunicorn 的
# `--forwarded-allow-ips`（默认只信任 127.0.0.1，也就是默认**不**采信 nginx 容器）。
# 这正是第二档演示要暴露的点：谁被信任、REMOTE_ADDR 最终是谁。
# 详见 docker/README.md「gunicorn 与 --forwarded-allow-ips」。
#
# 只在本 profile 里启动：docker compose --profile gunicorn up -d --build
# =============================================================================

log_format ced_observed '$request_method $request_uri '
                        'proto=$server_protocol cl=$http_content_length '
                        'te=$http_transfer_encoding';

upstream ced_gunicorn {
    server backend:8090;
}

server {
    listen 8081 default_server;
    server_name _;

    client_max_body_size 0;
    client_body_timeout 30s;
    keepalive_timeout 0;

    # 与 front/nginx.conf 同一套日志格式，方便两条链路对照
    access_log /dev/stdout ced_observed;
    error_log  /dev/stderr warn;

    location / {
        proxy_pass http://ced_gunicorn;
        proxy_http_version 1.1;

        # 与定帧无关的转发元信息
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-CED-Observer "nginx-1.25-alpine(gateway)";
        # Content-Length / Transfer-Encoding 一律不碰（同 front/nginx.conf）

        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}
