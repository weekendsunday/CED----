# =============================================================================
# CED 真实链路演示：nginx 作为「被观测的前置」
#
# 一、这个 nginx 是什么
#     它是**被测对象**，不是安全防护，也不负责"修好"任何请求。
#     我们对它的配置要求只有一条：
#
#         如实按自己的定帧策略处理（forward as it understands it）
#
#     它「读到什么」与它「转发出去什么」之间的差异，正是本工具要观测的东西。
#     任何"顺手把畸形请求规范化掉"的配置都会掩盖被测差异 —— 所以下面刻意不做那类处理。
#
# 二、链路
#     客户端 → 本 nginx(容器内 80) → probe:8800（CED 探针，扮演真实后端）
#     探针把收到的字节记成一个「视角」；控制口 8801 供 CED 引擎 /views、/reset。
#
# 三、本配置对定帧头做了什么（逐条说清）
#     不改写 / 未触碰：
#       · proxy_pass_request_body      —— 默认 on，请求体照发（本文件不设，即默认）
#       · proxy_set_header Content-Length    —— **不设**，交由 nginx 自己的定帧结论决定
#       · proxy_set_header Transfer-Encoding —— **不设**，同上
#       · proxy_request_buffering      —— 保持默认 on：转发出去的是 nginx 自己重定帧后的体
#     会改写：
#       · Host        —— 显式写成 $host（nginx 默认是 $proxy_host，此处只是显式化）
#       · Connection  —— nginx 默认给上游发 Connection: close（本文件不覆盖）
#       · X-CED-Observer —— 本文件新增的标记头，仅用于证据追溯，与定帧无关
#     nginx 自身不可配置掉的定帧行为（与上面的指令无关）：
#       · 请求体按它自己的 CL/TE 优先级读取；chunked 请求体默认被缓冲后
#         以 Content-Length 重新发给上游；hop-by-hop 头不转发。
#       ※ 这些细节（尤其 CL 与 TE 同时出现时是转发还是 400）**本机没有 Docker，
#         未实机验证**，以现场实测为准：`docker compose logs front` + 探针 /views。
#
# 四、启动依赖
#     upstream 里的主机名在 **nginx 启动时**就要能解析，所以 compose 里
#     front 依赖 probe 的 healthcheck（depends_on: service_healthy）。
# =============================================================================

log_format ced_observed '$request_method $request_uri '
                        'proto=$server_protocol cl=$http_content_length '
                        'te=$http_transfer_encoding';

upstream ced_probe {
    # 唯一的 upstream：探针数据口，扮演"真实后端"
    server probe:8800;
}

server {
    listen 80 default_server;
    server_name _;

    # 观测口径：不要在 nginx 这一层就把请求掐掉。
    # 否则报告里的"拒绝"分不清是产品行为还是我们配置出来的。
    client_max_body_size 0;
    client_body_timeout 30s;
    # 每个用例一条连接：观测不被连接复用串味
    keepalive_timeout 0;

    # nginx 眼里这条请求长什么样 —— 留证，方便和探针 /views 对照
    access_log /dev/stdout ced_observed;
    error_log  /dev/stderr warn;

    location / {
        proxy_pass http://ced_probe;
        proxy_http_version 1.1;

        # 只做两件与定帧无关的事。除此之外**没有别的 proxy_set_header**：
        # Content-Length / Transfer-Encoding 一律不碰。
        proxy_set_header Host $host;
        proxy_set_header X-CED-Observer "nginx-1.25-alpine";

        # 探针在客户端半关闭或空闲超时后才回观测；给足时间，别让 nginx 先超时断链
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}
